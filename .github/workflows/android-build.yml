name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          # ubuntu-latest 镜像已预装 Android SDK, 路径由环境变量给出, 不再硬编码
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          CMDLINE_TOOLS="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ -d "$CMDLINE_TOOLS" ]; then
            echo "$CMDLINE_TOOLS" >> $GITHUB_PATH
            yes | "$CMDLINE_TOOLS/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$CMDLINE_TOOLS/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          echo "Using Android SDK at: $SDK_ROOT"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate changelog asset
        run: |
          export TZ=Asia/Shanghai
          mkdir -p mobile/src/main/assets
          {
            echo "# omi4wOS 更新记录（自动生成 · 最新在前）"
            echo ""
            git log -60 --date=format:'%Y-%m-%d %H:%M' --pretty=format:'%h | %cd | %s' | head -60
          } > mobile/src/main/assets/changelog.txt
          echo "changelog.txt generated: $(wc -l < mobile/src/main/assets/changelog.txt) lines"

      - name: Clean stale build outputs
        run: |
          ./gradlew --stop || true
          rm -rf ~/.gradle/caches/build-cache-1 || true
          ./gradlew clean --no-build-cache || true

      - name: Build mobile APK
        run: ./gradlew :mobile:assembleDebug -PbuildNumber=${{ github.run_number }} --no-build-cache --rerun-tasks

      - name: Build wear APK
        run: ./gradlew :wear:assembleDebug --no-build-cache --rerun-tasks

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/build/outputs/apk/debug/*.apk

      - name: Upload wear APK
        uses: actions/upload-artifact@v4
        with:
          name: wear-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
